<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chinese Pronunciation Trainer</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

.header{
background:#2196f3;
color:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

button{
padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
margin:5px;
background:#2196f3;
color:white;
}

button:hover{
opacity:.9;
}

select{
padding:10px;
width:100%;
margin-top:10px;
margin-bottom:10px;
}

.score{
font-size:40px;
font-weight:bold;
color:green;
}

.result{
font-size:22px;
margin-top:10px;
}

.lesson{
font-size:40px;
text-align:center;
margin:20px 0;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

@media(max-width:768px){
.grid{
grid-template-columns:1fr;
}
}

</style>

</head>
<body>

<div class="container">

<div class="header">
<h1>🇨🇳 Chinese Pronunciation Trainer</h1>
<p>Luyện phát âm Pinyin - HSK1</p>
</div>

<div class="grid">

<div class="card">

<h2>Bài học Pinyin</h2>

<select id="lessonSelect">

<option value="mā">mā</option>
<option value="má">má</option>
<option value="mǎ">mǎ</option>
<option value="mà">mà</option>

<option value="nǐ hǎo">你好</option>
<option value="xiè xie">谢谢</option>
<option value="lǎoshī">老师</option>
<option value="xuéshēng">学生</option>

</select>

<div class="lesson" id="lessonDisplay">
mā
</div>

<button onclick="playSample()">
🔊 Nghe mẫu
</button>

</div>

<div class="card">

<h2>Luyện nói</h2>

<button onclick="startRecognition()">
🎤 Bắt đầu
</button>

<button onclick="stopRecognition()">
⏹ Dừng
</button>

<div class="result">
Bạn nói:
<span id="speechResult">
...
</span>
</div>

<h3>Điểm phát âm</h3>

<div class="score" id="score">
0
</div>

<div id="feedback"></div>

</div>

</div>

<div class="card">

<h2>Biểu đồ thanh điệu</h2>

<canvas id="toneChart"></canvas>

</div>

<div class="card">

<h2>Hướng dẫn khẩu hình</h2>

<div id="mouthGuide">

<b>m</b>

<p>
Khép môi hoàn toàn rồi bật hơi nhẹ.
</p>

</div>

</div>

</div>

<script>

const lessonDisplay =
document.getElementById("lessonDisplay");

const lessonSelect =
document.getElementById("lessonSelect");

lessonSelect.addEventListener("change",()=>{

lessonDisplay.innerText =
lessonSelect.value;

updateToneChart();

});

function playSample(){

const text =
lessonSelect.value;

const url =
`https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=zh-CN&client=tw-ob`;

new Audio(url).play();

}

let SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

let recognition =
new SpeechRecognition();

recognition.lang="zh-CN";
recognition.interimResults=false;
recognition.continuous=false;

recognition.onresult=(event)=>{

let result =
event.results[0][0].transcript;

document.getElementById("speechResult")
.innerText=result;

gradePronunciation(result);

}

function startRecognition(){

recognition.start();

}

function stopRecognition(){

recognition.stop();

}

function normalize(str){

return str
.toLowerCase()
.replace(/\s/g,'');

}

function gradePronunciation(userSpeech){

let target =
lessonSelect.value;

let score = 0;

let targetText =
normalize(target);

let userText =
normalize(userSpeech);

if(userText === targetText){

score = 100;

}
else{

let matches = 0;

for(let i=0;i<Math.min(targetText.length,userText.length);i++){

if(targetText[i]===userText[i]){

matches++;

}

}

score =
Math.round(
(matches/targetText.length)*100
);

}

document.getElementById("score")
.innerText=score;

let feedback="";

if(score>=90){

feedback="Xuất sắc 🎉";

}else if(score>=80){

feedback="Rất tốt 👍";

}else if(score>=70){

feedback="Tốt 👌";

}else if(score>=60){

feedback="Cần cải thiện";

}else{

feedback="Luyện tập thêm";

}

document.getElementById("feedback")
.innerHTML=feedback;

}

const ctx =
document.getElementById('toneChart');

let chart;

function updateToneChart(){

let lesson =
lessonSelect.value;

let data = [80,80,80,80,80];

if(lesson.includes("á")){

data=[40,50,60,80,100];

}

if(lesson.includes("ǎ")){

data=[90,50,20,50,90];

}

if(lesson.includes("à")){

data=[100,80,60,40,20];

}

if(chart){

chart.destroy();

}

chart = new Chart(ctx,{

type:'line',

data:{

labels:[
'1','2','3','4','5'
],

datasets:[{

label:'Tone',

data:data,

borderWidth:3

}]

},

options:{

responsive:true,

plugins:{

legend:{
display:true
}

}

}

});

}

updateToneChart();

</script>

</body>
</html>
